name: package-health

# Checks the *shape* of what gets published, which the test suite cannot see
# (#416).  All three failure modes here are invisible locally — they only bite a
# consumer after `npm publish`:
#
#   - publint  — a broken `exports` map, a `files` list missing the built output,
#                a `types` path that points at nothing.
#   - attw     — declarations that resolve for the author but not for a consumer
#                under their module resolution.
#   - knip     — a module reachable from no entry point (dead weight in the
#                tarball), or an import with no manifest entry behind it, which
#                works locally and breaks on a fresh install.
#
# Plus one gate on what the closures CI installs *contain* rather than on
# their shape:
#
#   - bun audit — an advisory-database query over `bun.lock` (#539), and
#                over the two other Bun lockfiles a workflow installs,
#                `docs/bun.lock` and `devtools-ui/bun.lock` (#1413).
#
# Same path filter discipline as build.yml: this can only change when a
# manifest or lockfile it audits, the source, the tsconfig or this workflow
# changes.

on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'package.json'
      - '.bun-version'
      - 'bun.lock'
      - 'docs/package.json'
      - 'docs/bun.lock'
      - 'devtools-ui/package.json'
      - 'devtools-ui/bun.lock'
      - 'tsconfig.json'
      - 'knip.jsonc'
      - '.github/workflows/package-health.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'package.json'
      - '.bun-version'
      - 'bun.lock'
      - 'docs/package.json'
      - 'docs/bun.lock'
      - 'devtools-ui/package.json'
      - 'devtools-ui/bun.lock'
      - 'tsconfig.json'
      - 'knip.jsonc'
      - '.github/workflows/package-health.yml'
  # The audit step is the reason this workflow also runs on a clock (#539).
  # Every other check here is a pure function of the files in the path filter,
  # so a push trigger covers them completely.  An advisory is not: it is
  # published upstream, against a lockfile that did not change, and a
  # push-only gate would not notice until the next unrelated commit to
  # `src/**`.  Mondays 05:00 UTC, offset from the 06:00 Europe/Berlin
  # Dependabot window so the two do not report the same morning.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

# Least privilege, stated rather than inherited: the repository default is
# read-only today, but a settings flip would otherwise hand a write token to
# a job that installs and runs the whole dependency tree.  #621
permissions:
  contents: read

jobs:
  package-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Frozen, like every other install in CI: an unfrozen resolve can
      # green-light a dependency set no lockfile records, so the check
      # passes against something nobody can reproduce.  #622
      - name: Install
        run: bun install --frozen-lockfile

      # publint and attw both inspect the built package, so `dist/` has to exist
      # first.  Built once here rather than by `lint:package`, so the job does
      # not pay for three builds.
      - name: Build (tsc → dist/)
        run: bun run build:lib

      # Each step runs the package.json script rather than repeating the tool
      # invocation, so the flags live in exactly one place and a local
      # `bun run lint:package` checks the same thing this job does.  The scripts
      # call the installed binaries directly (not `bunx`): `node_modules/.bin` is
      # on PATH inside a script, so a missing install fails loudly here instead
      # of being papered over by a registry download.
      - name: publint — manifest and exports map
        run: bun run lint:publint

      # `esm-only` (set in the script) is the honest profile: this package ships
      # no CJS, so the "ESM (dynamic import only)" note for a CJS consumer
      # describes the design rather than a defect.  Without it the job would fail
      # on a warning that has no fix short of shipping CJS.
      - name: arethetypeswrong — declarations resolve for consumers
        run: bun run lint:types-exports

      # `knip-bun`, not `knip`: the Node binary exhausts its heap on this repo's
      # module graph, and Bun is the project's primary toolchain anyway.
      - name: knip — dead modules and undeclared imports
        run: bun run lint:knip

      # #539 — the advisory gate.  Deliberately `bun audit` rather than
      # `actions/dependency-review-action`: that action diffs GitHub's
      # dependency graph, and the graph does not resolve this repository's root
      # Bun lockfile.  It records `fastify ^5.12.3` — the unresolved range out
      # of package.json — and carries no `find-my-way` entry at all, while
      # bun.lock pins fastify@5.12.5 and find-my-way@9.7.0.  Which is why the
      # only Dependabot alerts this repository has ever produced come from the
      # npm lockfiles under `examples/`, and the HIGH advisories that sat in
      # the shipped closure produced none.  `bun audit` reads bun.lock
      # directly, so it sees the versions that actually ship.
      #
      # The flags live in `package.json` (`lint:audit`), like every other check
      # in this job, so `bun run lint:audit` locally means the same thing.
      # `--audit-level=high` and nothing else, now.  The gate landed baselined —
      # 11 `--ignore`d advisory IDs, every HIGH the closure carried at the time
      # — because an unbaselined gate would have landed red on its first run and
      # taught everyone to ignore it, while still failing on every *new* high or
      # critical advisory from day one, which was the part that was missing.  It
      # then did exactly that: six unsuppressed `fast-uri` advisories published
      # afterwards took this job red on `develop`.  #779 cleared all 19 of them
      # with an in-range bump of the lockfile alone (`bun audit fix`; no
      # manifest range widened), and the baseline went with them.  A suppression
      # added back has to be listed in `SECURITY.md`, and
      # `tests/unit/ci/SecurityPolicy.test.ts` fails if the two drift apart, so
      # the baseline cannot quietly come back.
      - name: bun audit — advisory database over bun.lock
        run: bun run lint:audit

      # #1413 — the same query over the other two Bun closures CI installs.
      # `bun.lock` is the shipped closure, but not the only lockfile a runner
      # resolves: docs-checks.yml and docs.yml install `docs/bun.lock` for the
      # site build, and test.yml, multi-runtime.yml and publish.yml install
      # `devtools-ui/bun.lock` — the last inside the job that holds the
      # publishing token.  Neither was read by any advisory gate, and between
      # them they carried nine high advisories with in-range fixes while the
      # step above stayed green.  No install precedes these two steps on
      # purpose: `bun audit` reads the lockfile and asks the registry, so the
      # closure never lands on this runner.  They live here rather than in
      # docs-checks.yml because the cron above covers them too — an advisory
      # published against an unchanged `docs/bun.lock` is exactly the case
      # a push-only workflow misses.
      #
      # `docs/` goes through its manifest's `lint:audit` like the root, so
      # `bun run lint:audit` under docs/ is CI's command.  `devtools-ui/`
      # spells the flags out instead: its manifest is hashed into the
      # embedded UI bundle's `source-hash`, so a script added there is a
      # `build:ui` and a regenerated `src/devtools/generated/UiAssets.ts` in
      # the same commit, for a line that has nothing to do with the UI.
      # `tests/unit/ci/SecurityPolicy.test.ts` reads both shapes, asserts
      # `--audit-level=high` on each, folds their `--ignore` flags into the
      # one list `SECURITY.md` has to match, and fails when a workflow
      # installs a Bun closure no step here audits.
      - name: bun audit — advisory database over docs/bun.lock
        working-directory: docs
        run: bun run lint:audit

      - name: bun audit — advisory database over devtools-ui/bun.lock
        working-directory: devtools-ui
        run: bun audit --audit-level=high
