name: publish

# Fires when a GitHub Release is published (e.g. via
# `gh release create vX.Y.Z --latest`).  Pre-release-flagged
# releases also trigger — gate on tag-shape if pre-releases
# shouldn't ship to @latest on npm.
#
# Auth model: **npm Trusted Publishing** via GitHub's OIDC.
# Registered on npmjs.com → Settings → Trusted Publishers for
# the `actor-ts` package, pinned to this repo + this workflow.
# No long-lived NPM_TOKEN secret is involved — the workflow
# exchanges its short-lived OIDC token for a one-shot npm
# publish token at runtime.  Requires npm >= 11.5.1.
#
# That auth model is also why every `uses:` below is pinned to a commit
# SHA rather than a tag (#585): an action author — or anyone who
# compromises their account — who repoints a mutable tag executes code
# on a runner in this workflow, and two of the actions below run in the
# job that holds `id-token: write`, next to a credential that can
# publish `actor-ts` to npm with provenance.  A SHA cannot be
# repointed.  The trailing `# vX.Y.Z` comment is what keeps Dependabot
# updating the pin; see `.github/dependabot.yml`.
on:
  release:
    types: [published]
  # Manual fallback: a release-event run uses the workflow file at the tag's
  # commit, so a workflow bug can't be fixed-and-re-run through the release
  # event alone.  Dispatching from a fixed branch re-attempts the publish;
  # the version guard below makes re-runs safe.
  workflow_dispatch:

# The version guard below (`npm view` → skip if already published) is a
# check-then-act, so two runs that overlap both see "not published" and both
# proceed — the loser then dies on npm's E403 for a duplicate version, which
# reads like a broken release rather than a race.  The release event and the
# manual fallback can genuinely overlap: the fallback exists to re-attempt a
# publish, and nothing stops it being dispatched while the original run is
# still going.  Serialise them instead.  Not `cancel-in-progress` — an
# in-flight `npm publish` is the last thing to interrupt.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Build and pack — no publishing credential anywhere near it (#703).
  #
  # This job runs the whole devDependency tree: `bun install` twice, the build,
  # the type checker and the suite.  It is therefore the job most likely to be
  # executing somebody else's code at any given moment, which is precisely why
  # it holds nothing but `contents: read`.  Its only output is the tarball.
  #
  # The `sbom` / `attach-sbom` pair below is the template, and the argument is
  # the one its comment already makes: a job that installs must not also hold a
  # credential.  Before this split that rule was enforced for `contents: write`
  # and waived for `id-token: write` — the stronger of the two, since it buys a
  # one-shot npm publish token, so a single compromised dev dependency could
  # ship `actor-ts` under a provenance attestation.
  # ---------------------------------------------------------------------------
  pack:
    name: Build and pack the tarball
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Bun installs first, and from `bun.lock` — the lockfile this repository
      # actually maintains, so this is the dependency set every other green
      # check was measured against.  Node comes afterwards because `npm pack`
      # needs npm, not because the install does.
      #
      # It used to say the order existed so better-sqlite3's postinstall would
      # resolve a prebuilt binary rather than fall back to a `node-gyp` source
      # build.  That reason expired with ad145463 (2026-07-22): the lockfile has
      # pinned better-sqlite3 >= 13.0.1 since, and 13.x ships `prebuilds/` with
      # no install script at all.  The root closure carries no install-time
      # script of any kind today, which `trustedDependencies: []` in
      # package.json now pins rather than merely describes.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `build` is `build:ui && tsc`, and `build:ui` reaches the DevTools UI,
      # whose toolchain is a separate, deliberately un-hoisted install (#483).
      #
      # Frozen matters more here than anywhere: `build:ui` regenerates the
      # embedded bundle from this tree and that regenerated module is what
      # gets packed, so an unfrozen resolve shipped a DevTools bundle built
      # from whatever devtools-ui/package.json's ranges resolved to that day —
      # under a provenance attestation, and invisible to `check:ui`, whose hash
      # covers the ranges and not the bytes.  Written out rather than
      # `bun run ui:install` because that script is the developer's unfrozen
      # regenerate command (#1622).
      - name: Install the DevTools UI toolchain
        run: bun install --frozen-lockfile --cwd devtools-ui

      # Spelled out rather than left to `prepublishOnly`.  `npm publish` runs
      # that script only for a directory spec, and the publish step below hands
      # it a tarball — so nothing would run these at all if this job did not.
      # `prepublishOnly` stays in package.json regardless: it is the net under a
      # `npm publish` run by hand from a clone, which has no job A in front of
      # it.  A failure here costs a re-run; the same failure discovered during
      # publish costs it after the tag and the GitHub Release already exist.
      - name: Verify the tree before packing
        run: |
          bun run clean
          bun run build
          bun run typecheck
          bun test
          bun run test:ui

      # Node 24 (the `engines` floor) bundles npm >= 11.5.1, the minimum for
      # trusted publishing.  No `registry-url` here — this job never talks to
      # the registry, and `npm pack` writes the tarball from `files` in
      # package.json without touching the network.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # `npm pack` runs `prepack`/`postpack` and nothing else — in particular
      # never `prepublishOnly` — and this repository declares neither, so the
      # step is exactly "write the tarball" and the steps above are what
      # actually vouched for it.
      - name: Pack the tarball
        run: npm pack

      - name: Hand the tarball to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: actor-ts-*.tgz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish — holds the credential, and does nothing else (#703).
  #
  # No checkout and no install, on the `attach-sbom` pattern: the only code
  # running beside `id-token: write` is npm itself and the two pinned actions
  # above it.  The version guard reads the version out of the downloaded
  # tarball rather than out of a working tree, which keeps this job
  # checkout-free and ties the guard to the bytes actually being published
  # instead of to a second copy of the repository that merely ought to match.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write     # Required for both npm provenance AND OIDC trusted publishing.

    steps:
      - name: Fetch the tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: tarball

      - name: Setup Node + npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Skip if this version already exists on npm
        id: version-check
        run: |
          TARBALL=$(ls ./tarball/actor-ts-*.tgz)
          VERSION=$(tar -xOf "$TARBALL" package/package.json \
            | node -pe "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if [ -z "$VERSION" ]; then
            echo "No version could be read out of $TARBALL — refusing to publish." >&2
            exit 1
          fi
          echo "Packed $TARBALL at version $VERSION."
          if npm view "actor-ts@$VERSION" version > /dev/null 2>&1; then
            echo "actor-ts@$VERSION already published — skipping publish step."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "actor-ts@$VERSION not on npm yet — will publish."
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version-check.outputs.already_published == 'false'
        # Tokenless — npm Trusted Publishing via GitHub OIDC.  With
        # `id-token: write` + a Trusted Publisher configured on npmjs.com
        # (repo pathosDev/actor-ts, workflow publish.yml, no environment),
        # npm ≥ 11.5.1 auto-detects the OIDC path — no NODE_AUTH_TOKEN.
        # `--provenance` signs via the same id-token; libnpmpublish computes
        # the attestation's subject digest over the tarball bytes, so a tarball
        # spec is attested exactly like a directory one.
        #
        # `--ignore-scripts` is belt and braces: `npm publish <tarball>` runs no
        # lifecycle script in the first place, because every lifecycle call in
        # publish.js is gated on the spec being a directory.  It costs nothing
        # and it stops a future npm from quietly changing that.
        run: npm publish --provenance --access public --ignore-scripts ./tarball/actor-ts-*.tgz

  # ---------------------------------------------------------------------------
  # CycloneDX SBOM, attached to the GitHub Release (#539).
  #
  # `--provenance` above answers "who built this tarball"; it says nothing
  # about what is *inside* the dependency closure.  A consumer asking whether
  # a release is affected by an advisory currently has to reconstruct the
  # closure from `bun.lock` — and GitHub's own dependency graph cannot do it
  # (it records the unresolved ranges out of package.json), which is why the
  # repository's Dependabot alerts have only ever come from the npm lockfiles
  # under `examples/`.  A CycloneDX document on the release answers it
  # directly.
  #
  # Split across two jobs on purpose, not for style.  Generating the SBOM
  # needs the installed tree, and uploading a release asset needs
  # `contents: write`; a single job would hold a credential that can push to
  # the repository *while* running the postinstall scripts of the entire
  # dependency tree.  `tests/unit/ci/WorkflowHygiene.test.ts` fails on exactly
  # that combination since #622, and the right answer to it is this split
  # rather than an exemption.
  #
  # Neither job is a dependency of `publish`, so a broken SBOM can never
  # block or delay shipping the package.
  # ---------------------------------------------------------------------------
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # The install is what makes the SBOM accurate.  Syft can read a
      # lockfile, but Bun's is not a format it is guaranteed to resolve, and a
      # bill of materials assembled from unresolved ranges is worse than none
      # — it looks authoritative and names versions nobody shipped.
      # Cataloguing `node_modules/` after a frozen install reports the exact
      # versions `bun.lock` produced, whatever syft knows about the lockfile.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Syft catalogues every manifest under the scan path, and this repository
      # carries ten that the package does not ship: `docs/package.json`,
      # `tests/integration/brokers/package.json`, and a `package.json` plus a
      # `package-lock.json` in each of the eight example front-ends.  Left in
      # place they land in the release SBOM as though they shipped — and those
      # npm lockfiles are exactly where every Dependabot alert this repository
      # has ever raised comes from, so the document would be actively
      # misleading about which advisories affect a release.  `files` in
      # package.json is the authority on what ships (`dist/`, README,
      # CHANGELOG, LICENSE); the rest goes.
      #
      # Deleting rather than configuring syft's excludes: the checkout is
      # ephemeral, this needs no second config file to keep in sync, and the
      # set being removed is auditable on one line.  Runs after the install,
      # so nothing it removes was needed.
      - name: Drop what the package does not ship
        run: rm -rf examples docs tests

      - name: Build the SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: actor-ts-sbom.cyclonedx.json
          # Both uploads are done explicitly below.  The action's own
          # release upload would have to run in this job, which installs —
          # the split this whole section exists for.
          upload-artifact: false
          upload-release-assets: false
          # Not a dependency-graph submission: the graph is repository-wide
          # and would start reporting a release's closure as the state of the
          # default branch.
          dependency-snapshot: false

      - name: Hand the SBOM to the upload job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: actor-ts-sbom.cyclonedx.json
          if-no-files-found: error

  attach-sbom:
    name: Attach the SBOM to the release
    needs: sbom
    # A `workflow_dispatch` re-run has no release to attach to; the SBOM is
    # still built above and kept as a workflow artifact.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    # No checkout and no install here — that is the point of the split.  The
    # only thing this job does with its write scope is upload one file.
    steps:
      - name: Fetch the SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom

      # `--clobber` for the same reason the publish step is version-guarded:
      # the manual fallback exists to re-attempt a release, and a re-run must
      # not die on "asset already exists".
      - name: Upload as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            "sbom/actor-ts-sbom.cyclonedx.json#CycloneDX SBOM ($TAG)" \
            --clobber
