name: nightly-flakes

# The two questions a single `bun test` cannot answer (#290, #538).
#
# 1. **Do the worker-thread multi-node suites still work on hosted runners?**
#    They were removed from every CI run for months by
#    `ACTOR_TS_SKIP_FLAKY_MNS=1`, on the claim that Bun on GitHub's runners
#    cannot respawn functional worker threads after the first worker test.  The
#    `worker-suites` job below runs exactly those suites, three repeats a night,
#    and that is what settled it: 21 consecutive nights without a single hang,
#    against a written criterion of fourteen.  The quarantine is gone; the job
#    stays as its regression guard, because the claim it retired can only be
#    retired for as long as somebody keeps measuring.
#
# 2. **Which tests are flaky, as opposed to which build was red?**  A red
#    build names one run's failures and then the log ages out.  The `stress`
#    job loops the whole suite and aggregates failures by test identity, so
#    "this test failed 2 of 5 times" is a fact you can act on instead of two
#    unrelated red builds a week apart.
#
# ## What the quarantine cost, since it is the reason this file is careful
#
# Three suites were hidden, and when the criterion was finally read against the
# runs it had been met for two of them.  The third, `LeaseMajority`, was not a
# runner problem at all: it was a product defect in split-brain resolution
# (#839) — a partition detected one peer at a time was resolved as a run of
# majority decisions, so both halves survived and the lease was never consulted.
# The quarantine had been hiding that for months rather than measuring it.
#
# Two mechanisms came out of that.  `tests/unit/ci/NoEnvironmentGatedSkips.test.ts`
# forbids an environment variable deciding whether a test runs, because that is
# precisely the thing a workflow can set; a capability probe, which asks the
# machine a question no workflow can answer, stays fine.  And every job in
# `.github/workflows/` now carries `timeout-minutes`, so a suite that stops
# making progress fails inside the hour instead of burning the six-hour default
# — the failure mode this quarantine was originally justified by.
#
# **Both jobs are `continue-on-error` on purpose.**  The suite still carries
# fixed sleeps that a stress loop is designed to surface (#418), and a red
# required check for a measurement trains people to ignore it.  The signal lives
# in the step summary, the annotation on the run, and the uploaded reports.
# That is also the weakest part of this file and is known to be: nothing reads
# the annotation on a schedule, which is how the fourteen-night criterion went
# uncounted for months (#1310).
#
# The evidence is the `summary.json` in each night's artifact; `greenRuns ==
# runs` is the green condition, and a non-empty `runsTimedOut` is red regardless
# of what else it says — the suite stopped making progress, so nothing can be
# said about its tests.  Since #1359 the harness also refuses to call a run
# green that no offender explains, which is what it used to do.
#
# **The first two nights produced no artifact at all** (2026-08-17 and
# 2026-08-18, both jobs: `No files were found with the provided path: .stress/`,
# `total_count: 0`), because `.stress` is a dot-directory and upload-artifact
# defaults `include-hidden-files` to false.  Both upload steps now set it, and
# `if-no-files-found: error` so a silent zero-file upload fails the step instead
# of warning into a log nobody reads;
# `tests/unit/ci/WorkflowHygiene.test.ts` asserts the pair for every hidden
# path in this directory.  Those two nights were never counted.
#
# Docs: docs/src/content/docs/testing/diagnosing-flakes.mdx (EN) and its DE
# mirror carry the same history for contributors who never read CI YAML.

on:
  # 04:00 UTC — after integration.yml (03:00) and integration-brokers.yml
  # (03:30), so the three nightlies do not contend for the same runner pool
  # minute.  Cron fires only on the default branch (`develop`).
  schedule:
    - cron: '0 4 * * *'
  # On demand for any branch: the point of a manual run is usually to check
  # whether a specific change moved the numbers, which cannot wait for 04:00.
  workflow_dispatch:
    inputs:
      worker-suite-runs:
        description: 'Repeats of the three worker-thread multi-node suites'
        required: false
        default: '3'
      stress-runs:
        description: 'Repeats of the whole suite'
        required: false
        default: '5'

# Read-only floor, stated rather than inherited (#621).  Neither job writes
# anything: the results leave as an artifact and a step summary.
permissions:
  contents: read

jobs:
  # The regression guard for the un-quarantining.  These three suites spawn real
  # OS threads and drive real partitions, which is the combination that was
  # claimed not to work on hosted runners; running them on their own, several
  # times, is how that claim stays checked now that they also run in `test.yml`
  # like any other suite.
  worker-suites:
    name: worker-thread multi-node suites, repeated
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here talks to the remote, and the step after this one
          # installs and executes the whole devDependency tree (#622).
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Run the worker-thread suites
        id: stress
        env:
          RUNS: ${{ inputs.worker-suite-runs || '3' }}
        # The harness writes its own `$GITHUB_STEP_SUMMARY` table, so the
        # workflow stays thin and a local run shows the same output — the
        # same reason integration.yml delegates to an npm script.
        #
        # `--run-timeout` is stated rather than left to the harness default,
        # because it has to be read against this job's `timeout-minutes: 30`:
        # 3 runs x 8 min = 24 min, leaving room for checkout and install. The
        # documented symptom of these three suites is a *hang* — workers spawn,
        # handshake and never run — so the watchdog is what turns tonight into
        # a recorded result instead of a job GitHub killed with nothing to show.
        # A `worker-suite-runs` input above 3 needs `timeout-minutes` raised with
        # it, or the job dies before the last run's watchdog can fire.
        run: |
          bun run test:stress -- \
            --runs="$RUNS" \
            --run-timeout=480000 \
            --report-dir=.stress \
            tests/multi-node/LeaseMajority.test.ts \
            tests/multi-node/ParallelPubSub.test.ts \
            tests/unit/testkit/ParallelMultiNodeSpec.test.ts

      - name: Upload reports
        # `always()`: the run that failed is the one whose log is worth
        # keeping.  Nothing in the repository uploaded an artifact before
        # this, so a nightly failure used to be readable only from the job
        # log, which ages out — and per-run failure identity with it.
        #
        # `include-hidden-files` is not optional here and its absence is not
        # cosmetic: `.stress` is a dot-directory, upload-artifact defaults the
        # flag to false since v4.4, and so the first two nights uploaded
        # **nothing at all** — `No files were found with the provided path`,
        # `total_count: 0` on both runs — while the header above and the docs
        # page both call that artifact the only durable evidence of the
        # fourteen-night criterion.  `if-no-files-found: error` is the half
        # that would have said so on night one; `publish.yml`'s SBOM step
        # already uses it.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-suites-${{ github.run_id }}-${{ github.run_attempt }}
          path: .stress/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      - name: Annotate
        if: always()
        env:
          # Through `env:`, never `${{ }}` inside the script — a workflow
          # expression is pasted into the shell before it runs.
          OUTCOME: ${{ steps.stress.outcome }}
        run: |
          if [[ "$OUTCOME" == "success" ]]; then
            echo "::notice title=Worker-thread suites green::All three passed every repeat. Nothing to do."
          else
            echo "::warning title=Worker-thread suites failed::These run in test.yml too, so this is a real regression rather than a known-red measurement. A run marked HUNG is the old hosted-runner symptom (workers spawn, handshake, never run) and would mean the #538 defect is back. Details in the step summary; per-run logs in the uploaded artifact."
          fi

  # The flake catalog's data source.  Loops the whole suite, which is now
  # literally the whole suite: with nothing quarantined, `--skip-quarantined`
  # would subtract nothing and the verdict is about every test CI runs.
  stress:
    name: whole suite, repeated
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Repeat the suite
        id: stress
        env:
          RUNS: ${{ inputs.stress-runs || '5' }}
        # 5 runs x 20 min = 100 min against `timeout-minutes: 120`. A full local
        # suite is about 4.5 min, so 20 min is loose on purpose: the watchdog is
        # for a run that has stopped progressing, not for a slow runner.
        run: bun run test:stress -- --runs="$RUNS" --run-timeout=1200000 --report-dir=.stress

      - name: Upload reports
        # See the worker-suites job's upload step for why both flags are here.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-${{ github.run_id }}-${{ github.run_attempt }}
          path: .stress/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      - name: Annotate
        if: always()
        env:
          OUTCOME: ${{ steps.stress.outcome }}
        run: |
          if [[ "$OUTCOME" == "success" ]]; then
            echo "::notice title=No test failed in any repeat::Nothing to add to the flake catalog tonight."
          else
            echo "::warning title=At least one test failed in some repeats::Add the named tests to the catalog in docs/src/content/docs/testing/diagnosing-flakes.mdx, or fix them. A test that failed in EVERY repeat is broken rather than flaky and belongs in an issue, not the catalog."
          fi
