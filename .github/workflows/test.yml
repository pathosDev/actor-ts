name: tests

# Runs the unit / multi-node / smoke suite + the README-badge
# updater.  Triggers on any change that could plausibly affect a
# test result: source code, ANY test subtree (unit, multi-node,
# smoke, AND integration — tests that share helpers in
# `tests/integration/` could shift unit-test imports), dependency
# manifest, tsconfig — and the prose the suite reads.
#
# That last clause is not decoration.  This file used to say docs-only,
# README-only, ROADMAP and CHANGELOG changes "can't change test outcomes",
# and five test files now read exactly those: SupplyChainDocs (CHANGELOG +
# two pages), GossipReplayBoundDocumented (ROADMAP + two pages),
# RateLimitEvictionClaims, ExampleWiringClaims and SleepRatchet.  A
# ROADMAP-only edit turning one of those claims back was measured red while
# CI would not have run at all.  A guard CI skips on the file it guards is
# a guard only for whoever runs the suite locally.

on:
  # Run on every branch push (feature work merges locally, so a branch push
  # is often the only pre-merge signal), not just `develop`.
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.bun-version'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'tsconfig.dev.json'
      - 'docs/**'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.bun-version'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'tsconfig.dev.json'
      - 'docs/**'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - '.github/workflows/test.yml'
  workflow_dispatch:

# Serialise runs that share the same ref — without this, two develop-
# push runs that both reach the "Commit + push README" step race on
# `git push`: the second fetches a base that's already moved and
# fails with `non-fast-forward`.  Grouping by `github.ref`:
#   - develop pushes (`refs/heads/develop`) queue behind each other →
#     README updates land in order, no force-push gymnastics.
#   - PRs (`refs/pull/N/merge`) get their own group per PR →
#     different PRs don't block each other.
#   - Re-pushes to the same PR cancel the in-flight run → no
#     wasted CI on stale commits.
# `cancel-in-progress` evaluated per event type: cancel for PRs
# (drop stale work), queue for develop pushes (preserve every commit's
# README state).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Typecheck, run the suite ONCE with `--coverage`, and parse the stats
    # out of that single run.  The suite used to run twice (a `test` job
    # without coverage, then `update-readme` with coverage), which gave the
    # parser a different bun output to read than the one the build status
    # came from — a flaky timing-sensitive test under coverage
    # instrumentation could push the badge to "1489 of 1490" while the
    # build itself stayed green.  One run, one source of truth; the `badge`
    # job below consumes this job's numbers and never re-runs anything.
    runs-on: ubuntu-latest
    # Read-only, and the checkout below drops its credential too (#622).
    # This job installs and executes the entire devDependency tree — the
    # last place a token that can write to the repository belongs.  The
    # README push it used to do lives in `badge`, which runs no third-party
    # code at all.
    permissions:
      contents: read
    # Consumed by `badge`.  Both producers publish even when the suite fails,
    # which is exactly when the badge has to flip to red — `stats` parses the
    # counts out of the JUnit report, and `coverage` (which therefore runs on
    # a red suite too) hands back the figure it gated on.
    outputs:
      pass: ${{ steps.stats.outputs.pass }}
      total: ${{ steps.stats.outputs.total }}
      lines: ${{ steps.coverage.outputs.lines }}
    steps:
      # The run's artifacts, defined once because two steps address them — one
      # writes them, the next gates on them — and a path spelled twice is a
      # path that can be edited once.  All under the runner temp dir so the
      # workspace the badge job checks out stays clean.
      #
      # This is a step rather than a job-level `env:` block because the
      # `runner` context is not available there — GitHub rejects the whole
      # file at validation time, so the workflow does not run at all.
      # `$RUNNER_TEMP` is the same directory, reachable from any step's shell.
      - name: Resolve the run's artifact paths
        run: |
          {
            echo "JUNIT_FILE=$RUNNER_TEMP/test-results.junit.xml"
            echo "LOG_FILE=$RUNNER_TEMP/bun-test.log"
            # The lcov half of the same run.  The per-module floors cannot come
            # from the text table even in principle: a rollup of bun's per-file
            # percentages averages a ten-line barrel against a thousand-line
            # coordinator, where lcov's LF:/LH: counts weight by the lines that
            # exist.
            echo "COVERAGE_DIR=$RUNNER_TEMP/coverage"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job talks to the remote: no test, source file or
          # script shells out to git, and `bun.lock` has no git-protocol
          # dependencies.  So the pushable credential checkout leaves behind
          # in `.git/config` is pure attack surface for the ~2000 packages
          # installed one step later.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Frozen, like build.yml and publish.yml: an unfrozen install resolves
      # whatever `package.json`'s ranges allow right now, so the required
      # `tests` check could pass against a dependency set no lockfile ever
      # recorded and nobody could reproduce.  Dependabot does not speak the
      # Bun lockfile format, so its PRs fail here until `bun.lock` is
      # regenerated — that is the intended signal, and #817 is what removes
      # the manual step.
      - name: Install
        run: bun install --frozen-lockfile

      # The DevTools UI has its own install, deliberately not a workspace, and
      # the root typecheck reaches it through scripts/ui-toolchain.mjs. That
      # guard skips a missing toolchain locally and fails hard under CI (#483),
      # so the UI is type-checked on every run rather than only by whoever
      # happens to have installed it.
      - name: Install the DevTools UI toolchain
        run: bun run ui:install

      - name: Typecheck
        run: bun run typecheck

      # The UI's own suite. It is a separate runner (Vitest, in jsdom) because
      # it needs a DOM, which `bun test` deliberately does not provide — the
      # framework-free half of the UI stays on `bun test` and runs above.
      - name: DevTools UI specs
        run: bun run test:ui

      - name: Tests with coverage
        id: stats
        # The worker-thread multi-node suites (ParallelMultiNodeSpec +
        # parallel-pubsub) and the in-process LeaseMajority e2e are
        # quarantined on GitHub's hosted runners — Bun there can't respawn
        # functional worker threads after the first test, which also
        # starves the lease arbitration into a false split-brain.  They
        # run locally + in Docker; the real-network `integration` workflow
        # is the multi-node CI gate.  `nightly-flakes.yml` runs these three
        # with the flag OFF and carries the exit criterion — #538.
        env:
          ACTOR_TS_SKIP_FLAKY_MNS: '1'
        run: |
          # bun's output goes to a FILE, never through a pipe.  Under GitHub
          # Actions bun emits one annotation line per test — ~8700 lines for
          # this suite — and `OUTPUT=$(bun test …)` pushed that whole burst
          # through a command-substitution pipe.  bun died mid-flush with
          # `error: An internal error occurred (WriteFailed)`, truncating the
          # coverage table three-quarters of the way in and taking the JUnit
          # report with it (oven-sh/bun#15860 is the same family: large
          # suites, intermittent, "the second attempt ran fine").
          #
          # The identical command reproduces clean locally, where bun prints
          # no per-test lines and the burst is eight times smaller — so the
          # volume through the pipe is the trigger, not the flags.  A regular
          # file cannot short-write the way a pipe can.
          #
          # Failure is not allowed to kill the step: the parsed numbers have
          # to reach `steps.stats.outputs` so the README can still flip to a
          # red badge when the suite breaks.  bun's exit status is replayed
          # at the end so the job's own result is unchanged.
          set +e
          bun test --coverage \
            --coverage-reporter=text --coverage-reporter=lcov \
            --coverage-dir="$COVERAGE_DIR" \
            --reporter=junit --reporter-outfile="$JUNIT_FILE" > "$LOG_FILE" 2>&1
          STATUS=$?
          set -e

          # Replay bun's output so the GitHub Actions UI still shows
          # per-test results just like a regular `bun test` step.
          cat "$LOG_FILE"
          echo "bun test exited with status $STATUS"

          # Test counts come from the JUnit report, never from the console.
          # Bun 1.3.14 stopped printing the trailing
          #    N pass / M skip / K fail / Ran X tests across Y files
          # summary block under GitHub Actions (it groups its output there and
          # reports the totals out of band), so the previous
          # `grep "^[[:space:]]+[0-9]+ pass$"` scrape matched nothing.  That
          # alone was survivable; what made it ship was the `[[ -z "$PASS" ]]
          # && PASS=0` fallback, which turned "the parser found nothing" into
          # a perfectly plausible zero and pushed a `tests-0 of 0` badge from
          # a green run.  Hence both halves of this rewrite: read a contract
          # that does not move between bun releases, and treat an unreadable
          # count as an error rather than as zero.
          #
          #   <testsuites name="bun test" tests="6269" failures="0" skipped="23" …>
          #
          # `tests` counts skipped tests too, so subtract them.  `total` stays
          # "actually-executed tests" exactly as before — "6246 of 6246" means
          # all 6246 active tests passed, with skips counted separately.
          PASS=''
          TOTAL=''
          if [[ -s "$JUNIT_FILE" ]]; then
            # The root element only — nested <testsuite> rows carry the same
            # attribute names per file.
            SUMMARY=$(grep -m1 -o '<testsuites [^>]*>' "$JUNIT_FILE" || true)
            echo "----- JUnit summary (parser input) -----"
            echo "${SUMMARY:-<none found>}"
            echo "----------------------------------------"
            TESTS=$(printf '%s' "$SUMMARY" | grep -oE ' tests="[0-9]+"' | grep -oE '[0-9]+' || true)
            FAILURES=$(printf '%s' "$SUMMARY" | grep -oE ' failures="[0-9]+"' | grep -oE '[0-9]+' || true)
            SKIPPED=$(printf '%s' "$SUMMARY" | grep -oE ' skipped="[0-9]+"' | grep -oE '[0-9]+' || true)
            if [[ -n "$TESTS" && -n "$FAILURES" && -n "$SKIPPED" ]]; then
              TOTAL=$((TESTS - SKIPPED))
              PASS=$((TOTAL - FAILURES))
            fi
          else
            echo "::error::bun wrote no JUnit report to $JUNIT_FILE — the run died before the reporter flushed, or --reporter=junit is no longer supported."
          fi
          # A suite that executes nothing is a broken parser, not a green run.
          if [[ -z "$TOTAL" || "$TOTAL" -le 0 || "$PASS" -lt 0 ]]; then
            echo "::error::Could not read test counts from the JUnit report — refusing to report a zero. The README keeps its previous figures."
            PASS=''
            TOTAL=''
          fi

          # Coverage is NOT parsed here.  It used to be — `grep "^All files" |
          # awk -F'|' '{print $3}'`, truncated with `${LINES%.*}` and compared
          # as an integer in the gate step below — while a second
          # implementation of the same parse lived in the gate script for local
          # runs.  Two parsers over one table agreed only for as long as the
          # floor was a whole number, and only one of them could ever gate the
          # per-module floors, which need the lcov half of the run.  The script
          # is the only parser now and this workflow is its caller; the badge
          # figure comes back out of it.  #541, #1016.

          # Only ever publish numbers that parsed.  An absent output trips the
          # `badge` job's guard, which leaves the last good README in place —
          # far better than overwriting it with a confident-looking zero.
          if [[ -n "$PASS" ]]; then
            echo "pass=$PASS"       >> "$GITHUB_OUTPUT"
            echo "total=$TOTAL"     >> "$GITHUB_OUTPUT"
          fi
          echo "Parsed: ${PASS:-?} of ${TOTAL:-?} tests passing"

          # The test counts only render a badge. `main` is branch-protected
          # on this check, so a cosmetic parse failure must never be able to
          # block a release: the `badge` job annotates a warning and leaves
          # the README on its previous figures, which is exactly what
          # publishing nothing rather than a zero is for.  Coverage is the
          # other kind — it gates — and the step below is what fails on it.

          # Propagate the original bun exit status — non-zero turns
          # the job red, but the step outputs above are already
          # written so the README job downstream still has data.
          exit $STATUS

      - name: Coverage-floor gate
        id: coverage
        # `scripts/coverage-gate.mjs` over the two artifacts of the run that
        # already happened — the captured log for the aggregate floor, the lcov
        # report for the per-module ones.  It refuses `--log` without `--lcov`,
        # so this step cannot degrade into gating half of what it says it gates.
        # The floors themselves live in the script and nowhere else, on purpose:
        # a COVERAGE_LINE_FLOOR here would be a second place the number lives
        # and a way to loosen the gate without the loosening showing up in a
        # diff of the gate.  `tests/unit/ci/CoverageGate.test.ts` asserts that.
        #
        # `!cancelled()` rather than `success()`: the badge figure comes out of
        # this step now, and a red suite is exactly when the README has to stop
        # claiming the old number.  Skipped when the suite never ran at all (a
        # typecheck failure, a frozen-install rejection) — there is no log to
        # read then, and an error about a missing file would bury the real one.
        if: ${{ !cancelled() && steps.stats.conclusion != 'skipped' }}
        run: bun scripts/coverage-gate.mjs --log="$LOG_FILE" --lcov="$COVERAGE_DIR/lcov.info"

  # The badge updater — the only job in this workflow that can write to the
  # repository, and deliberately the only one that runs no third-party code
  # (#622).  It installs nothing, builds nothing and re-runs nothing: it
  # consumes `test`'s parsed numbers, rewrites README.md with sed, and
  # pushes.  Before the split, `contents: write` plus a persisted git
  # credential sat in the same job that executed the whole devDependency
  # tree, so any postinstall script or compromised transitive package could
  # have pushed to develop.
  #
  # The workflow-level `concurrency` group covers this job too, so two
  # develop pushes still queue instead of racing on `git push`.
  badge:
    name: README badges
    needs: test
    # `!cancelled()`, not `success()` — a red suite is exactly when the
    # badge has to flip to red.  PRs and every branch but develop skip
    # (forks have no push rights anyway).
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # "The suite failed" and "the suite never ran" used to look identical
      # from here: both left the outputs empty, both skipped the badge
      # silently, and the README kept showing the last good numbers.  A
      # frozen install that rejects a drifted lockfile is exactly the second
      # case, so say so out loud instead of leaving stale figures on the
      # front page unexplained.
      #
      # The plausibility check below is the second line of defence, added
      # after a bun upgrade broke the upstream parser and this job cheerfully
      # published `tests-0 of 0` from a green run: the guard only asked
      # whether the numbers were *present*, and a zero is present.  Upstream
      # no longer emits zeros, but the README is the project's front page —
      # it is worth two jobs disagreeing before it gets rewritten.
      - name: Check the suite produced numbers
        id: parsed
        env:
          PASS: ${{ needs.test.outputs.pass }}
          TOTAL: ${{ needs.test.outputs.total }}
          LINES: ${{ needs.test.outputs.lines }}
        run: |
          if [[ -z "$PASS" || -z "$TOTAL" || -z "$LINES" ]]; then
            echo "::warning title=README badges not updated::The test job produced no numbers — it failed before or during the parse step (a frozen-install rejection, a typecheck error, a runner crash). The README still shows the previous run's figures."
            echo "updatable=false" >> "$GITHUB_OUTPUT"
          elif ! [[ "$PASS" =~ ^[0-9]+$ && "$TOTAL" =~ ^[0-9]+$ && "$LINES" =~ ^[0-9]+$ ]] || (( TOTAL == 0 )); then
            echo "::warning title=README badges not updated::The test job reported an implausible result ($PASS of $TOTAL tests, $LINES% coverage). A zero or non-numeric count means the parser broke, not that the suite is empty — the README still shows the previous run's figures."
            echo "updatable=false" >> "$GITHUB_OUTPUT"
          else
            echo "updatable=true" >> "$GITHUB_OUTPUT"
            echo "the suite reported $PASS of $TOTAL passing at $LINES% line coverage"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.parsed.outputs.updatable == 'true'

      - name: Update README badges + inline references
        if: steps.parsed.outputs.updatable == 'true'
        # Through `env:` rather than `${{ }}` inside the script: a workflow
        # expression is pasted into the shell before it runs, so a parser
        # that ever yielded something other than digits would be executing
        # it.  Environment variables are values, never code.
        env:
          PASS: ${{ needs.test.outputs.pass }}
          TOTAL: ${{ needs.test.outputs.total }}
          LINES: ${{ needs.test.outputs.lines }}
        run: |
          # Pick badge color from pass/total ratio:
          #   pass == total → green   (22c55e)  — all green
          #   pass <  total → red     (ef4444)  — at least one fail
          # Coverage badge follows the same green by default; thresholds
          # could be added later (e.g. <70% → red, <85% → yellow).
          if [[ "$PASS" -eq "$TOTAL" ]]; then
            TEST_COLOR="22c55e"
            STATUS_LABEL="green"
          else
            TEST_COLOR="ef4444"
            STATUS_LABEL="red"
          fi
          COV_COLOR="22c55e"
          echo "Computed badge state:"
          echo "  tests-${PASS}/${TOTAL} (${STATUS_LABEL})"
          echo "  coverage-~${LINES}%"

          # 1. Static badge URLs (img.shields.io) — pattern matches the
          #    full 'tests-X%20of%20Y-COLOR' segment so the colour gets
          #    rewritten when the ratio shifts.
          sed -i -E "s|tests-[0-9]+%20of%20[0-9]+-[0-9a-fA-F]{6}|tests-${PASS}%20of%20${TOTAL}-${TEST_COLOR}|g" README.md
          sed -i -E "s|coverage-~[0-9]+%25-[0-9a-fA-F]{6}|coverage-~${LINES}%25-${COV_COLOR}|g" README.md
          # 2. Inline prose references.  Test-count regex demands 3+ digits
          #    so '~9 tests' (env-gated subset elsewhere) is not matched.
          sed -i -E "s|~[0-9]{3,}( tests)|~${PASS}\1|g" README.md
          sed -i -E "s|~[0-9]+( % line)|~${LINES}\1|g" README.md

          # Make the result of the substitutions explicit in the log.
          # Previously the only signal that this step had done anything
          # was a downstream "no badge changes" line — opaque when the
          # README already happened to match the freshly-computed
          # numbers (e.g. an unchanged-flake commit re-running on the
          # same red badge state).  Now the diff is visible inline.
          if git diff --quiet README.md; then
            echo "README already reflects ${PASS}/${TOTAL} ${STATUS_LABEL} — no edits needed"
          else
            echo "README diff after substitution:"
            git --no-pager diff -U0 README.md
          fi

      - name: Commit + push README if changed
        if: steps.parsed.outputs.updatable == 'true'
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore(readme): update test count + coverage stats [skip ci]"
            git push
            echo "pushed README update"
          else
            echo "README unchanged — nothing to commit (the previous run already pushed these numbers)"
          fi
