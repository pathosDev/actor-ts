# Dependabot config — daily dependency scans, opening PRs against `develop`
# (the default branch).
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# **Every tracked `package.json` has an entry here**, and
# `tests/unit/ci/WorkflowHygiene.test.ts` fails when one does not.  The
# repository carries thirteen manifests and this file watched exactly one of
# them until #1596.  What the other twelve got was *security* updates, which
# Dependabot opens from the dependency graph regardless of this file (the
# `npm_and_yarn group across N directories` PRs); a non-advisory bump never
# reached them, and keeping them current was a hand sweep (#1520).
#
# **The ecosystem follows the lockfile CI installs from.**  The `npm` updater
# reads `package-lock.json` and has no code for `bun.lock` at all, so on a
# Bun-installed directory it works manifest-only: a caret range already
# admits every minor and patch, an in-range release changes nothing it can
# see, and the root's minor-and-patch group opened not one PR in five months
# — while every major it did open went red on `--frozen-lockfile` until
# someone regenerated `bun.lock` by hand (#817).  The `bun` updater runs
# `bun install <dep>@<version> --save-text-lockfile` and commits the result,
# so its PRs arrive green and in-range updates surface.  Neither updater
# touches `peerDependencies` — the parser reads `dependencies`,
# `devDependencies` and `optionalDependencies` — so no peer floor moves as a
# side effect.  Security updates are unaffected either way; they never came
# from these entries.
#
# One entry per Bun directory, deliberately not a `directories:` list: a
# grouped update across directories is a single PR, and the DevTools UI half
# of one is red by construction (see that entry), which must not hold a root
# or docs bump hostage.
#
# **The updater's Bun reads `lockfileVersion` 1 and nothing newer.**  It
# bundles 1.3.14, and since dependabot/dependabot-core#15896 a newer stamp is
# a hard `DependencyFileNotSupported` for that entry — no PRs, no downgrade;
# dependabot/dependabot-core#16071 raises the ceiling and is still open.  Bun
# 1.4 stamps a *fresh* `bun.lock` 2 but preserves an existing 1 on every
# re-save, so the exposure is a lockfile regenerated from scratch, which then
# silently stops being updated.  The content of a v1 and a v2 lockfile is
# identical — v2 only added parse-time strictness — so the fix is to restamp
# the file to 1.  The guard test pins the ceiling and names this paragraph.

version: 2

updates:
  # ── Bun-installed manifests: `package.json` + `bun.lock` ──────────────

  # The library.  actor-ts is published, so Dependabot leaves an in-range
  # requirement alone and moves `bun.lock` only; a major rewrites the range,
  # as it always did.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # `chore` plus Dependabot's own scope gives `chore(deps)` /
    # `chore(deps-dev)`, the two scopes AGENTS.md lists.  A prefix that
    # already carries a scope doubles it — `chore(deps)(deps-dev): …` is what
    # every root PR in the log reads.
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group minor + patch updates so each manifest gets one PR per day
    # rather than 15.  Major bumps still get their own PRs (we want to
    # eyeball those individually).
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # `@types/node` deliberately tracks the `engines` support floor (24),
    # not latest, so a newer-Node API cannot slip in unnoticed — see
    # `ac552d5b` and the matching Node leg in multi-runtime.yml.  Nothing
    # we run catches the violation: with the major bump applied, both
    # typecheck and the full suite stay green, because the pin's whole
    # job is to make those APIs unrepresentable at compile time.  Without
    # this rule the same PR keeps returning (#334, #336, #340, #374,
    # #481).  Minor/patch inside the pinned major still flow; when the
    # floor is raised deliberately, pin and rule move together.  #906
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  # The Starlight site.  `docs-checks.yml` installs it frozen on every PR
  # and builds it, so a bump that does not resolve, or one that breaks the
  # rendering (#1527), is red here rather than at the release deploy (#473).
  # No `@types/node` rule here: TypeDoc compiles `../src` with the *root*
  # tsconfig, so the root's pin is the one that guards the library, and the
  # copy in this manifest only types the site's own scripts.
  - package-ecosystem: "bun"
    directory: "/docs"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The DevTools UI toolchain (#483).  **Its PRs are red by construction and
  # that is the signal**: `bun run check:ui` compares the `source-hash` in
  # `src/devtools/generated/UiAssets.ts` against the UI sources *and this
  # directory's `package.json`*, because the Angular and ECharts versions are
  # baked into the embedded bundle.  A bump here therefore needs
  # `bun run build:ui` and the regenerated module in the same merge — the
  # same step any change under `devtools-ui/` needs — and the `build`
  # workflow says so until it has it.
  #
  # `bun.lock` here is stamped `lockfileVersion: 1` on purpose; it was born
  # under Bun 1.4.0 as a 2 (`65548aa9`) and the updater cannot read a 2 (file
  # header).  Bun 1.4 preserves the 1 on every re-save.
  - package-ecosystem: "bun"
    directory: "/devtools-ui"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The frameworks measured against actor-ts (#27).  Pinned exactly, and a
  # merge here is a re-measure trigger: each result file names the version
  # it ran, and the release checklist re-runs `bench:compare` before the
  # tables are updated.  `benchmarks.yml` installs the directory frozen and
  # type-checks it, so a bump that breaks an arm's compile is red on the PR.
  - package-ecosystem: "bun"
    directory: "/benchmarks/comparison"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The live-broker runner manifest.  No lockfile by design — every
  # `Dockerfile.runner` installs it unfrozen, so the images already float
  # inside the declared ranges — which makes this entry manifest-only: what
  # it surfaces is a driver release *outside* a range, the one kind of bump
  # the floating install can never pick up.  `integration-brokers.yml` runs
  # the suites against the bumped driver on the PR.
  - package-ecosystem: "bun"
    directory: "/tests/integration/brokers"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # ── npm-installed manifests: `package.json` + `package-lock.json` ─────

  # The eight bundled example frontends.  `examples.yml` builds each one
  # with `npm ci` from `package-lock.json`, so the npm updater is the one
  # that can keep the lockfile CI reads in step with the manifest.  Each
  # directory also carries a `bun.lock` that nothing in CI installs and that
  # this entry does not write — whether that file stays at all is #1402, and
  # until it is decided the `bun install --frozen-lockfile --dry-run` leg in
  # `examples.yml` goes red on the directories a PR touches, naming the
  # lockfile to sync.
  #
  # Listed explicitly rather than globbed, like the matrix in
  # `examples.yml`: a new frontend is a deliberate line here, and the guard
  # test fails until it has one.  One `directories:` list rather than eight
  # entries, because the chat and voice pairs share a toolchain: the
  # minor-and-patch group spans all eight (one PR a day, not eight), and the
  # per-dependency group lands a major in both halves of a pair at once —
  # ungrouped, `directories:` opens one PR per directory per dependency.
  - package-ecosystem: "npm"
    directories:
      - "/examples/chat/frontend-angular"
      - "/examples/chat/frontend-next"
      - "/examples/chat/frontend-react"
      - "/examples/chat/frontend-svelte"
      - "/examples/voice/frontend-angular"
      - "/examples/voice/frontend-next"
      - "/examples/voice/frontend-react"
      - "/examples/voice/frontend-svelte"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # Everything the first group does not take — the majors — one PR per
      # dependency across the directories it appears in.
      per-dependency:
        group-by: "dependency-name"

  # GitHub Actions versions used in workflows themselves.
  #
  # Every `uses:` in `.github/workflows/` is pinned to a full 40-character
  # commit SHA with the release tag in a trailing `# vX.Y.Z` comment (#585).
  # A tag is a mutable pointer: whoever can move `actions/checkout@v7` can
  # run arbitrary code inside `publish.yml`'s job, which holds
  # `id-token: write` and publishes to npm with provenance.  A SHA cannot be
  # repointed.
  #
  # **The trailing comment is load-bearing, not decoration.**  Dependabot
  # reads it to learn which version a SHA stands for; without it the pin is
  # invisible to updates and the repository silently freezes on a stale —
  # eventually vulnerable — action, which is a worse posture than the
  # mutable tags this replaced.  Keep the format exactly `<sha> # <tag>`,
  # and let Dependabot rewrite both halves together.
  #
  # `tests/unit/ci/WorkflowHygiene.test.ts` asserts the shape on every
  # `bun test` run, because nothing else in the toolchain reads these files.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    # Dependabot treats every `uses:` path as its own dependency, so an action
    # referenced through more than one sub-path gets one PR per path — and for
    # `github/codeql-action` those PRs are individually invalid.  `init` writes
    # a config file stamped with its own version and `analyze` refuses to read
    # one that does not match, so each half creates the very skew it fails on:
    #
    #     Loaded a configuration file for version '4.37.8', but running version '4.37.7'
    #
    # Only merging both is green — #1346 and #1347 were each red alone.  A check
    # that says nothing about the change in front of it is worse than no check:
    # it teaches you to merge codeql PRs unread, on the one workflow whose job
    # is to find security defects.
    #
    # **Keyed on the action, not on an update type.**  A minor-and-patch group
    # mirroring the npm block above would not fix this — the sub-path coupling
    # holds at every update type, so a major bump would split into two invalid
    # PRs again, leaving the bump that most deserves an eyeball as the one that
    # lands red.
    #
    # The rest stays ungrouped on purpose.  The npm block groups to avoid ~15
    # PRs a day; actions have no such volume, and an actions bump rewrites a SHA
    # pin inside workflows that hold `id-token: write` (#585), so one PR per
    # action is the review posture worth keeping.
    #
    # `github/codeql-action` is the only multi-sub-path action here today, so
    # the pattern list is precise rather than speculative — and
    # `tests/unit/ci/WorkflowHygiene.test.ts` fails when another one appears
    # without a pattern, because nothing else in the toolchain reads this file.
    # #1348
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
