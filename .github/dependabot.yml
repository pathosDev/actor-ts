# Dependabot config — daily dependency scans, opens PRs against main.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # npm peer-deps + dependencies + devDependencies in package.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group minor + patch updates so each ecosystem gets one PR per day
    # rather than 15.  Major bumps still get their own PRs (we want to
    # eyeball those individually).
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # `@types/node` deliberately tracks the `engines` support floor (24),
    # not latest, so a newer-Node API cannot slip in unnoticed — see
    # `ac552d5b` and the matching Node leg in multi-runtime.yml.  Nothing
    # we run catches the violation: with the major bump applied, both
    # typecheck and the full suite stay green, because the pin's whole
    # job is to make those APIs unrepresentable at compile time.  Without
    # this rule the same PR keeps returning (#334, #336, #340, #374,
    # #481).  Minor/patch inside the pinned major still flow; when the
    # floor is raised deliberately, pin and rule move together.  #906
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions versions used in workflows themselves.
  #
  # Every `uses:` in `.github/workflows/` is pinned to a full 40-character
  # commit SHA with the release tag in a trailing `# vX.Y.Z` comment (#585).
  # A tag is a mutable pointer: whoever can move `actions/checkout@v7` can
  # run arbitrary code inside `publish.yml`'s job, which holds
  # `id-token: write` and publishes to npm with provenance.  A SHA cannot be
  # repointed.
  #
  # **The trailing comment is load-bearing, not decoration.**  Dependabot
  # reads it to learn which version a SHA stands for; without it the pin is
  # invisible to updates and the repository silently freezes on a stale —
  # eventually vulnerable — action, which is a worse posture than the
  # mutable tags this replaced.  Keep the format exactly `<sha> # <tag>`,
  # and let Dependabot rewrite both halves together.
  #
  # `tests/unit/ci/WorkflowHygiene.test.ts` asserts the shape on every
  # `bun test` run, because nothing else in the toolchain reads these files.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
