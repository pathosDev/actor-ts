## actor-ts voice sample — HOCON configuration.
##
## Loaded by `ActorSystem.create(SYSTEM_NAME, { configFile })`.  Tune
## knobs that don't change per-node here; CLI flags from
## `backend/config.ts` (host, port, http-port, seeds) win over
## anything set in this file.
##
## Notably absent: a `persistence` block.  The voice sample has no
## journal — there are no PersistentActors and no SqliteJournal
## wired up.  Voice is ephemeral by design; if the cluster goes
## down, in-flight rooms and presence are simply gone.

actor-ts {
  # Logging.  Accepted values: debug, info, warn, error, off.
  logger {
    level = "info"
  }

  # Cluster timing — the same demo-scale settings as the chat sample: a
  # node that dies is flagged unreachable after 1.5 s of silence.
  cluster {
    failure-detector {
      heartbeat-interval = 300ms
      unreachable-after  = 1500ms
      down-after         = 4s
    }
    gossip-interval = 500ms

    # Who removes a node that dies without leaving.  With no strategy the
    # failure detector removes a silent node itself at down-after (4 s
    # here), but under a real partition both sides remove each other and
    # run on as two clusters.  keep-majority lets the two survivors of three
    # remove it once the view has held still for stable-after -- about
    # 1.5 s + 3 s after the kill here -- and the minority side of a real
    # partition removes itself instead of forking the cluster.
    split-brain-resolver {
      active-strategy = keep-majority
      stable-after    = 3s
    }
  }
}
