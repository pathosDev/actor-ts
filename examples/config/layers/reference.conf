# The project's own defaults — committed with the code, read over the
# reference.conf bundled with actor-ts and under application.conf.
# examples/config/layers.ts names this file; a project of your own finds
# ./reference.conf in its working directory without being told.
my-app {
  greeting  = "hello from reference.conf"
  pool-size = 4

  db {
    host = "localhost"
    port = 5432
  }
}
