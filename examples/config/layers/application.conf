# One deployment's overrides — single keys of reference.conf, nothing more.
my-app {
  # Replaces the project default.
  greeting = "hello from application.conf"

  # Nothing after the `=`: no value, so the key keeps what the layer beneath
  # says (4, from reference.conf).  `pool-size = ""` would clear it instead.
  pool-size =

  # Read out of the .env file the example names (layers/example.env) —
  # unless the real environment sets DB_PASSWORD, which then wins.
  db.password = ${DB_PASSWORD}

  # A string built from pieces on one line, reading the layer beneath
  # (db.host and db.port come from reference.conf) and the variable.
  db.url = "postgres://app:"${DB_PASSWORD}"@"${my-app.db.host}":"${my-app.db.port}"/app"
}
