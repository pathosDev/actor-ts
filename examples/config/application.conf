# Example application.conf that an operator might ship with a deployment.
# HOCON is a superset of JSON, so pure JSON works too.

actor-ts {
  system.name = "order-service"

  logger.level = "info"

  cluster {
    # Override just the fields we care about; the rest comes from reference.conf.
    gossip-interval = 500ms
    seed-retry-interval = 2s

    # One variable per peer, each holding the whole "host:port" — set from the
    # environment at deploy time; unset ones drop out of the array.  The parser
    # does not implement value concatenation, so ${?HOST}":"${?PORT} would land
    # as three elements, not one address (#537).  See /cluster/joining-and-seeds/.
    seed-nodes = [ ${?SEED_1}, ${?SEED_2} ]
  }

  sharding {
    number-of-shards = 128
    remember-entities = true
    passivation-idle = 2 minutes
  }

  remote {
    tcp.host = ${?POD_IP}
    tcp.port = 2552
    max-frame-bytes = 4 MiB
  }

  http {
    backend = "fastify"
    shutdown-grace-period = 10s
  }
}
