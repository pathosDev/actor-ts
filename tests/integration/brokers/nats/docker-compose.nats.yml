# NATS live-integration suite (B.6 / #24).
#
# NATS boots in well under a second — the fastest broker in the
# suite.  No auth, no clustering — just the standalone server on
# port 4222, with JetStream enabled so the JetStream, key-value and
# object-store actors have something to run against.
#
# Run locally:
#   bun run test:integration:broker nats
#   bun run test:integration:broker:teardown nats

name: actor-ts-integration-nats

services:
  nats:
    # Pinned to the release `latest` resolved to when the pin was written, and
    # Dependabot moves it (#1597): a new NATS arrives as a PR that runs this
    # suite, so an upstream regression still surfaces within a day — attributable
    # to the bump, instead of turning the nightly red underneath a run.
    # Production users pin their own version.
    image: nats:2.15.0
    # `-p 4222` for client traffic.  No healthcheck here: the
    # NATS image is built on `scratch` and ships no shell / curl /
    # wget / nc, so docker-compose has no way to probe readiness
    # from inside the container.  Instead the runner's own
    # `waitForPort` (lib/WaitForPort.ts) polls the client port
    # until it accepts a TCP connection — same readiness shape,
    # just from the OUTSIDE.
    # `-js` enables JetStream, and it is not optional: the JetStream, KV and
    # object-store actors all need it, and without it this suite covered core
    # NATS only — which is how a broken push-consumer path stayed invisible
    # (#1526).  `-sd` puts the stream store on the container filesystem, which
    # is thrown away with the container between runs.
    command: ["-p", "4222", "-js", "-sd", "/tmp/jetstream"]
    networks:
      natsnet: {}

  runner:
    build:
      context: ../../../..
      dockerfile: tests/integration/brokers/nats/Dockerfile.runner
    depends_on:
      nats:
        # `service_started` because the scratch image has no
        # readiness probe — see the comment on the nats service
        # above.  The runner's `waitForPort` is the actual gate.
        condition: service_started
    environment:
      NATS_SERVERS: nats://nats:4222
    networks:
      natsnet: {}

networks:
  natsnet: {}
