# Mosquitto live-integration suite (B.3 / #21).
#
# Brings up a Mosquitto broker + a runner that exercises MqttActor
# against real MQTT 3.1.1 + 5.0 traffic.  Anonymous auth — the
# broker is only reachable on the compose bridge, never published
# to the host.
#
# Run locally:
#   bun run test:integration:broker mqtt
#   bun run test:integration:broker:teardown mqtt

name: actor-ts-integration-mqtt

services:
  mosquitto:
    # Pinned to the release `latest` resolved to when the pin was written, and
    # Dependabot moves it (#1597): a new Mosquitto arrives as a PR that runs this
    # suite, so an upstream regression still surfaces within a day — attributable
    # to the bump, instead of turning the nightly red underneath a run.
    # Production users pin their own version.
    # `-alpine` because that is what the official image's `latest` is — no
    # plain `2.1.2` tag exists; `openssl` is the other variant.
    image: eclipse-mosquitto:2.1.2-alpine
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    # Quick health probe — `mosquitto_sub` ships with the image and
    # exits 0 once a subscription succeeds, so compose can wait for
    # the broker to actually be accepting traffic.
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t 'healthcheck' -W 1 -E -i healthcheck-probe || true"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      mqttnet: {}

  runner:
    build:
      context: ../../../..
      dockerfile: tests/integration/brokers/mqtt/Dockerfile.runner
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      MQTT_CLIENT_ID: actor-ts-runner
    networks:
      mqttnet: {}

networks:
  mqttnet: {}
