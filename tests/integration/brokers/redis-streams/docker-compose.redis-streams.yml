# Redis Streams live-integration suite (B.7 / refs #296).
#
# Redis 7 ships streams in the open-source build.  No persistence,
# no clustering — single-node ephemeral instance.
#
# Run locally:
#   bun run test:integration:redis
#   bun run test:integration:redis:teardown

name: actor-ts-integration-redis-streams

services:
  redis:
    # `latest` deliberately — integration tests want to surface
    # upstream Redis regressions as soon as they ship.  Production
    # users pin a specific version themselves.
    image: redis:latest
    # `stream-node-max-entries 10` is what makes the MAXLEN ~ scenario
    # deterministic.  `~` trims whole macro nodes and never a partial one, and
    # a node is sealed at whichever of stream-node-max-entries (default 100) or
    # stream-node-max-bytes (default 4096) is reached first.  That scenario
    # writes 50 entries of roughly 80 bytes — about 4 000 in total, sitting on
    # the byte threshold — so whether a second node existed to trim decided the
    # result, and the assertion flipped between runs with nothing changing.
    # Ten entries per node puts it well clear of the boundary, in the direction
    # the scenario means to test.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--stream-node-max-entries", "10"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      redisnet: {}

  runner:
    build:
      context: ../../../..
      dockerfile: tests/integration/brokers/redis-streams/Dockerfile.runner
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
    networks:
      redisnet: {}

networks:
  redisnet: {}
