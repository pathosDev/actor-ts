# Bun test configuration.
#
# Deliberately almost empty.  The per-test timeout stays at bun's own 5 000 ms:
# `tests/unit/ci/AwaitConditionBudgets.test.ts` gates every `awaitCondition`
# budget against that number and re-measures it in a child process rather than
# assuming it, and the "the cap is a backstop, the budget is what reports"
# doctrine in `docs/…/testing/diagnosing-flakes.mdx` rests on it being the same
# number everywhere.  A test that needs longer says so in its own third
# argument, sized by measurement.
#
# The `coveragePathIgnorePatterns` block that used to live here is gone with the
# quarantine it existed for (#538): it removed the worker-thread multi-node
# harness from the coverage denominator only because that harness could not
# execute on GitHub's hosted runners.  It can, and does — 21 consecutive green
# nights of `nightly-flakes.yml` against a written criterion of fourteen — so
# the three files are covered by the runs that exercise them like any other.
